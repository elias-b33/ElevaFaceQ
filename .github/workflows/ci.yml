name: ElevaFace CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Enable the repository's pinned package manager
        run: corepack enable
      - name: Install the frozen workspace without dependency lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check all workspace packages
        run: corepack pnpm typecheck
      - name: Run engine, advice and application tests
        run: corepack pnpm test
      - name: Build the hosted edition with same-origin model assets
        run: corepack pnpm build:vercel
      - name: Verify the produced hosted build
        run: corepack pnpm verify:hosted
